<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; box-sizing: border-box; padding: 60px 16px 100px; display: flex; flex-direction: column; gap: 14px; font-variant-numeric: tabular-nums">

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

      <span style="font-size: 13px; color: #9AA0A6">Max weight</span>

      <span style="font-size: 12px; color: #9AA0A6">since Sep 3</span>
    </div>
  </div>

  <div role="group" aria-label="Date range" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #17191C">

    <button style="height: 36px; border: none; border-radius: 9px; background: transparent; color: #9AA0A6; font-size: 14px; font-weight: 600">All</button>
  </div>

  <figure style="margin: 0; padding: 14px 8px 10px; border-radius: 16px; background: #17191C">

      <circle cx="44" cy="164" r="4" fill="#FF6A3D"></circle>
      <circle cx="76" cy="164" r="4" fill="#FF6A3D"></circle>

      <text x="44" y="202" text-anchor="start" font-size="11" fill="#9AA0A6">Sep 3</text>
      <text x="173" y="202" text-anchor="middle" font-size="11" fill="#9AA0A6">Oct 1</text>
      <text x="334" y="202" text-anchor="end" font-size="11" fill="#9AA0A6">Nov 6</text>
    </svg>
  </figure>

  <section style="display: flex; flex-direction: column; gap: 0; border-radius: 14px; background: #17191C; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 14px; border-bottom: 1px solid #26292E"><span style="font-size: 15px">Fri, Nov 6</span><span style="font-size: 15px; font-weight: 700">245 lb <span style="color: #9AA0A6; font-weight: 500">× 3</span></span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 14px; border-bottom: 1px solid #26292E"><span style="font-size: 15px">Thu, Oct 29</span><span style="font-size: 15px; font-weight: 700">235 lb <span style="color: #9AA0A6; font-weight: 500">× 5</span></span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 14px"><span style="font-size: 15px">Thu, Oct 22</span><span style="font-size: 15px; font-weight: 700">225 lb <span style="color: #9AA0A6; font-weight: 500">× 5</span></span></div>
  </section>

  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #17191C; border-top: 1px solid #26292E; display: flex; justify-content: space-around; padding-top: 10px; box-sizing: border-box">

    <a href="PresetEditor.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; color: #9AA0A6; text-decoration: none; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>Presets</a>
    <a href="Progress.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; color: #FF6A3D; text-decoration: none; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 6-6"></path></svg>Progress</a>
